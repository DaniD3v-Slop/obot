name: Image

on:
  push:
    branches: [homelab]

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/danid3v-slop/obot
          tags: |
            type=sha,format=long
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=ghcr.io/obot-platform/obot/base:latest
            MODEL_DATA_URL=https://upgrade-server.obot.ai/v1/model-data
            PROVIDERS_IMAGE=ghcr.io/danid3v-slop/providers:sha-185eb585823184babb6702cda3be3a97e47e147e@sha256:5b7e967cb45ca06a2f17aff7752669bbbb329cbf535c002af02ebf8d710091e4
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
